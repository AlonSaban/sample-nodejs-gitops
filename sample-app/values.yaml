replicaCount: 2

image:
  repository: ghcr.io/alonsaban/sample-nodejs
  pullPolicy: IfNotPresent
  tag: "v0.0.1"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  port: "8080"

# Just an example for the home assignment
secret:
  apiKey: "super-secret-demo-key"

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: "" # Empty host allows direct access via http://localhost/my-app without editing Windows hosts file
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi